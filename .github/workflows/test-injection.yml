name: Test Deployment Marker Injection

on:
  workflow_dispatch:
    inputs:
      deploy_version:
        description: 'Version to deploy'
        required: true
        default: 'v1.0.0'

jobs:
  mark-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Mark deployment
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          apiKey: "NRAK-FAKEKEY000000000000TESTONLY"
          commandType: changeTrackingCreateEvent
          category: Deployment
          type: BASIC
          entitySearch: "domain = 'APM' AND name = 'TestApp'"
          version: "${{ github.event.inputs.deploy_version }}"
          description: "Deploy ${{ github.event.inputs.deploy_version }}"
